name: CI/CD — Build & Deploy to Render

# ─────────────────────────────────────────────
# TRIGGERS
# ─────────────────────────────────────────────
on:
  push:
    branches: [main]       # runs automatically on every push to main
  workflow_dispatch:       # also lets you click "Run workflow" in GitHub UI

# ─────────────────────────────────────────────
# JOBS
# Two separate jobs so you can clearly see CI vs CD in the GitHub Actions UI
# ─────────────────────────────────────────────
jobs:

  # ════════════════════════════════════════════
  # JOB 1 — CI: Build & verify the code compiles
  # If this fails, the deploy job never runs.
  # ════════════════════════════════════════════
  build:
    name: CI — Build & Verify
    runs-on: ubuntu-latest

    steps:
      # ── 0. Get the source code ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 1. Build Angular ────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install npm packages
        run: npm ci
        working-directory: client

      - name: Build Angular (production)
        run: npm run build
        working-directory: client

      # ── 2. Build .NET ───────────────────────────────────────────────────
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore NuGet packages
        run: dotnet restore
        working-directory: API

      - name: Build .NET (verify it compiles)
        run: dotnet build --no-restore --configuration Release
        working-directory: API

  # ════════════════════════════════════════════
  # JOB 2 — CD: Deploy to Render
  # Only runs if the build job above passes (needs: build).
  # Render picks up the latest code, builds the Dockerfile, and deploys.
  # ════════════════════════════════════════════
  deploy:
    name: CD — Deploy to Render
    runs-on: ubuntu-latest
    needs: build            # ← waits for CI; skips deploy if build fails

    steps:
      - name: Trigger Render Deploy
        run: |
          curl --silent --fail --show-error \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        # RENDER_DEPLOY_HOOK_URL is stored as a GitHub Secret.
        # Get it from: Render Dashboard → your Web Service → Settings → Deploy Hook
        # Add it at:   GitHub repo → Settings → Secrets → Actions → New secret
